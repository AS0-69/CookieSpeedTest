<div class="card">
  <h1>Cookie Speed Test</h1>
  <h2>Meilleurs scores</h2>

  <table>
    <thead>
      <tr>
        <th>Joueur</th><th>Moyenne</th><th>Meilleur</th><th>Date</th><th>Voir la partie</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let score of tousLesScores">
        <td>{{ score.pseudo }}</td>
        <td>{{ score.tempsMoyen }}s</td>
        <td>{{ score.meilleurTemps }}s</td>
        <td>{{ score.date | date:'dd/MM/yyyy' }}</td>
        <td><button (click)="voirDetails(score.id)">Voir la partie</button></td>
      </tr>
    </tbody>
  </table>

  <button (click)="retourAccueil()">← Retour à l'acceuil</button>
</div>
